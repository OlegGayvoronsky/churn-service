# Grafana из kube-prometheus-stack подхватывает ConfigMap с меткой grafana_dashboard: "1" в namespace monitoring
apiVersion: v1
kind: ConfigMap
metadata:
  name: churn-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  churn.json: |
    {
      "uid": "churn-service",
      "title": "Churn service",
      "refresh": "10s",
      "time": {"from": "now-30m", "to": "now"},
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Версия модели в подах",
          "gridPos": {"x": 0, "y": 0, "w": 8, "h": 5},
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "options": {"textMode": "value_and_name", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [{"refId": "A", "expr": "count by (version) (churn_model_info)", "legendFormat": "{{version}}", "instant": true}]
        },
        {
          "id": 2, "type": "stat", "title": "Запросов к /v1/predict за 5 минут",
          "gridPos": {"x": 8, "y": 0, "w": 8, "h": 5},
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [{"refId": "A", "expr": "sum(increase(http_requests_total{handler=\"/v1/predict\"}[5m]))"}]
        },
        {
          "id": 3, "type": "stat", "title": "Рестарты контейнеров сервиса",
          "gridPos": {"x": 16, "y": 0, "w": 8, "h": 5},
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [{"refId": "A", "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"default\", container=\"api\"})"}]
        },
        {
          "id": 4, "type": "timeseries", "title": "Запросы в секунду",
          "gridPos": {"x": 0, "y": 5, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}},
          "targets": [{"refId": "A", "expr": "sum by (handler, status) (rate(http_requests_total{handler!=\"/metrics\"}[1m]))", "legendFormat": "{{handler}} {{status}}"}]
        },
        {
          "id": 5, "type": "timeseries", "title": "Задержка /v1/predict",
          "gridPos": {"x": 12, "y": 5, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "targets": [
            {"refId": "A", "expr": "histogram_quantile(0.5, sum by (le) (rate(http_request_duration_seconds_bucket{handler=\"/v1/predict\"}[1m])))", "legendFormat": "p50"},
            {"refId": "B", "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{handler=\"/v1/predict\"}[1m])))", "legendFormat": "p95"}
          ]
        },
        {
          "id": 6, "type": "timeseries", "title": "Доля клиентов с прогнозом «уйдёт»",
          "gridPos": {"x": 0, "y": 13, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
          "targets": [{"refId": "A", "expr": "sum(rate(churn_predictions_total{churn=\"true\"}[5m])) / sum(rate(churn_predictions_total[5m]))", "legendFormat": "churn=true"}]
        },
        {
          "id": 7, "type": "bargauge", "title": "Распределение score за 15 минут",
          "gridPos": {"x": 12, "y": 13, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "options": {"orientation": "vertical", "displayMode": "basic", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [{"refId": "A", "expr": "sum by (le) (increase(churn_score_bucket[15m]))", "format": "heatmap", "legendFormat": "{{le}}"}]
        },
        {
          "id": 8, "type": "timeseries", "title": "Размер батча (p50 / p95)",
          "gridPos": {"x": 0, "y": 21, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"refId": "A", "expr": "histogram_quantile(0.5, sum by (le) (rate(churn_batch_size_bucket[5m])))", "legendFormat": "p50"},
            {"refId": "B", "expr": "histogram_quantile(0.95, sum by (le) (rate(churn_batch_size_bucket[5m])))", "legendFormat": "p95"}
          ]
        },
        {
          "id": 9, "type": "timeseries", "title": "Age во входном потоке (p50 / p95)",
          "gridPos": {"x": 12, "y": 21, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"refId": "A", "expr": "histogram_quantile(0.5, sum by (le) (rate(churn_feature_age_bucket[5m])))", "legendFormat": "p50"},
            {"refId": "B", "expr": "histogram_quantile(0.95, sum by (le) (rate(churn_feature_age_bucket[5m])))", "legendFormat": "p95"}
          ]
        },
        {
          "id": 10, "type": "timeseries", "title": "CreditScore во входном потоке (p50 / p95)",
          "gridPos": {"x": 0, "y": 29, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"refId": "A", "expr": "histogram_quantile(0.5, sum by (le) (rate(churn_feature_credit_score_bucket[5m])))", "legendFormat": "p50"},
            {"refId": "B", "expr": "histogram_quantile(0.95, sum by (le) (rate(churn_feature_credit_score_bucket[5m])))", "legendFormat": "p95"}
          ]
        }
        {
          "id": 11, "type": "timeseries", "title": "Tenure во входном потоке (p50 / p95)",
          "gridPos": {"x": 12, "y": 29, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"refId": "A", "expr": "histogram_quantile(0.5, sum by (le) (rate(churn_feature_tenure_bucket[5m])))", "legendFormat": "p50"},
            {"refId": "B", "expr": "histogram_quantile(0.95, sum by (le) (rate(churn_feature_tenure_bucket[5m])))", "legendFormat": "p95"}
          ]
        }
        {
          "id": 12, "type": "timeseries", "title": "Balance во входном потоке (p50 / p95)",
          "gridPos": {"x": 0, "y": 37, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"refId": "A", "expr": "histogram_quantile(0.5, sum by (le) (rate(churn_feature_balance_bucket[5m])))", "legendFormat": "p50"},
            {"refId": "B", "expr": "histogram_quantile(0.95, sum by (le) (rate(churn_feature_balance_bucket[5m])))", "legendFormat": "p95"}
          ]
        }
        {
          "id": 13, "type": "timeseries", "title": "NumOfProducts во входном потоке (p50 / p95)",
          "gridPos": {"x": 12, "y": 37, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"refId": "A", "expr": "histogram_quantile(0.5, sum by (le) (rate(churn_feature_num_of_products_bucket[5m])))", "legendFormat": "p50"},
            {"refId": "B", "expr": "histogram_quantile(0.95, sum by (le) (rate(churn_feature_num_of_products_bucket[5m])))", "legendFormat": "p95"}
          ]
        }
        {
          "id": 14, "type": "timeseries", "title": "EstimatedSalary во входном потоке (p50 / p95)",
          "gridPos": {"x": 0, "y": 45, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"refId": "A", "expr": "histogram_quantile(0.5, sum by (le) (rate(churn_feature_estimated_salary_bucket[5m])))", "legendFormat": "p50"},
            {"refId": "B", "expr": "histogram_quantile(0.95, sum by (le) (rate(churn_feature_estimated_salary_bucket[5m])))", "legendFormat": "p95"}
          ]
        }
      ]
    }