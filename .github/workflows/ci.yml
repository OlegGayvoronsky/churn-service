name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: churn
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/churn

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  build:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, kind]
    concurrency: {group: deploy-kind}
    timeout-minutes: 10

    permissions:
      contents: read
      packages: read

    env:
      KIND_CLUSTER: churn-trashservice

    steps:
      - uses: actions/checkout@v7

      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: kind, kubectl и доступ к кластеру
        run: |
          B=~/.local/bin && mkdir -p $B && echo "$B" >> "$GITHUB_PATH"
          [ -x $B/kind ] || curl -sSLo $B/kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          [ -x $B/kubectl ] || curl -sSLo $B/kubectl https://dl.k8s.io/v1.37.0/bin/linux/amd64/kubectl
          chmod +x $B/kind $B/kubectl
          $B/kind export kubeconfig --name "$KIND_CLUSTER" --internal
          $B/kubectl get nodes

      - name: образ в кластер
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name "$KIND_CLUSTER"

      - name: подтягиваем секреты
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }} 
        run: |
          kubectl create secret generic churn-secrets \
          --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
          --from-literal=DATABASE_URL="postgresql://postgres:$DB_PASSWORD@postgres:5432/churn" \
          --dry-run=client -o yaml | kubectl apply -f -

      - name: база
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deploy/postgres --timeout=180s

      - name: пароль в базе = секрет
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "ALTER USER postgres PASSWORD :'pw';" | \
            kubectl exec -i deploy/postgres -- psql -U postgres -v pw="$DB_PASSWORD"
      
      - name: сервис
        run: |
          kubectl apply -f k8s/
          kubectl set image deploy/churn-service api="$IMAGE"
          kubectl rollout status deploy/churn-service --timeout=180s

      - name: smoke
        env:
          MODEL_NAME: churn_catboost
        run: |
          set -eo pipefail
          kubectl rollout status deploy/churn-service --timeout=180s
          U="http://$KIND_CLUSTER-control-plane:30080"; H="Host: churn-service.localhost"

          curl --fail -s --retry 10 --retry-delay 3 --retry-all-errors -H "$H" "$U/health" -o health.json
          cat health.json; echo
          jq -e --arg p "$MODEL_NAME-v" '.model_version | startswith($p) and test("-v[0-9]+$")' health.json

          for i in $(seq 1 10); do
            CODE=$(curl -s -o pred.json -w '%{http_code}' -X POST -H "$H" "$U/v1/predict" \
              -H "Content-Type: application/json" -d @good.json)
            echo "попытка $i: HTTP $CODE"
            case "$CODE" in 502|503|504|000) sleep 3 ;; *) break ;; esac
          done
          cat pred.json; echo
          [ "$CODE" = "200" ] || exit 1
          jq -e '(.score | type == "number") and .score >= 0 and .score <= 1' pred.json

          RID=$(jq -er .request_id pred.json)
          for i in $(seq 1 10); do
            N=$(kubectl exec deploy/postgres -- psql -U postgres -d churn \
              -tAc "SELECT count(*) FROM predictions WHERE request_id = '$RID'")
            [ "$N" = "1" ] && break
            sleep 1
          done
          [ "$N" = "1" ] || { echo "в базе $N строк с request_id=$RID, ожидалась 1"; exit 1; }
      
      - name: диагностика
        if: failure()
        run: |
          echo "::group::Поды и их статус"
          kubectl get pods -o wide
          echo "::endgroup::"

          echo "::group::Deployments"
          kubectl get deploy -o wide
          echo "::endgroup::"

          echo "::group::События кластера (последние 50)"
          kubectl get events --sort-by=.lastTimestamp -o wide | tail -50
          echo "::endgroup::"

          for pod in $(kubectl get pods -o jsonpath='{.items[*].metadata.name}'); do
            echo "::group::describe pod/$pod"
            kubectl describe pod "$pod"
            echo "::endgroup::"

            echo "::group::Логи pod/$pod (текущий запуск)"
            kubectl logs "$pod" --all-containers --tail=100 || echo "нет текущих логов"
            echo "::endgroup::"

            echo "::group::Логи pod/$pod (предыдущий запуск, если был рестарт)"
            kubectl logs "$pod" --all-containers --previous --tail=100 || echo "нет логов предыдущего запуска"
            echo "::endgroup::"
          done
